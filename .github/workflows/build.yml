name: Build Elite Dictionary APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java (Required for Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Flet Build Tools
        run: |
          pip install "flet[build]"
          
      - name: Build APK
        run: |
          # Собираем приложение под именем EliteDictionary
          flet build apk main.py --product "EliteDictionary"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: elite-dictionary-apk
          path: build/apk/app-release.apk
